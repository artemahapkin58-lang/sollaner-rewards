services:
  - type: web
    name: sollaner-rewards
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DB_PATH
        value: data/sollaner.sqlite3
      - key: POINTS_PER_MESSAGE
        value: "1"
      - key: MESSAGE_COOLDOWN
        value: "60"
      - key: DAILY_LIMIT
        value: "20"
      - key: DAILY_BONUS
        value: "3"
      - key: REWARD_COST
        value: "100"
